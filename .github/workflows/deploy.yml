
name: Deploy SupermarketERP to Somee

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DotNetApiTemplate/SupermarketERP.csproj

      - name: Publish
        run: dotnet publish DotNetApiTemplate/SupermarketERP.csproj -c Release -o ./publish

      - name: Test Somee FTP file upload
        shell: pwsh
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PATH: ${{ secrets.FTP_PATH }}
        run: |
          $ftpRoot = "ftp://$($env:FTP_SERVER)/$($env:FTP_PATH.Trim('/'))/"
          $credentials = "$($env:FTP_USERNAME):$($env:FTP_PASSWORD)"

          Set-Content -Path test-upload.txt -Value "FTP upload test"

          Write-Host "Testing FTP file upload..."

          curl.exe --fail --show-error --user $credentials --upload-file test-upload.txt "${ftpRoot}test-upload.txt"

          if ($LASTEXITCODE -ne 0) {
            throw "FTP file upload failed"
          }

          Write-Host "FTP file upload succeeded."

      - name: Deploy to Somee
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: ./publish/
          server-dir: ${{ secrets.FTP_PATH }}/
          dangerous-clean-slate: false
